<div class="app">
  <header class="top">
    <button class="btn icon ghost" id="bHome" title="מסך הפתיחה" aria-label="מסך הפתיחה"><svg class="i"><use href="#i-home"/></svg></button>
    <div class="brand"><h1>סטודיו פרספקס</h1><span>מעמדי הוקרה בעיצוב אישי</span></div>
    <div class="tb">
      <button class="btn icon ghost" id="bUndo" title="ביטול (Ctrl+Z)" aria-label="ביטול"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="btn icon ghost" id="bRedo" title="חזרה (Ctrl+Y)" aria-label="חזרה"><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="btn gold" id="bAI"><svg class="i"><use href="#i-spark"/></svg>עיצוב AI</button>
      <button class="btn opt-m" id="bQuiz">שאלון ומחיר</button>
      <button class="btn opt-m" id="bRates">מחירון</button>
      <button class="btn primary" id="bFinish">סיום והצעת מחיר</button>
    </div>
  </header>
  <div class="main">
    <aside class="panel" aria-label="כלי עיצוב">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="shape" aria-selected="true"><svg class="i"><use href="#i-shape"/></svg>צורה</button>
        <button role="tab" data-tab="size"><svg class="i"><use href="#i-layers"/></svg>חומר</button>
        <button role="tab" data-tab="design"><svg class="i"><use href="#i-pen"/></svg>עיצוב</button>
        <button role="tab" data-tab="lib"><svg class="i"><use href="#i-grid"/></svg>מאגר</button>
        <button role="tab" data-tab="base"><svg class="i"><use href="#i-stand"/></svg>מעמד</button>
        <button role="tab" data-tab="order"><svg class="i"><use href="#i-bag"/></svg>הזמנה</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
    <section class="stage" id="stage" aria-label="תצוגה תלת־ממדית">
      <canvas class="gl" id="gl"></canvas>
      <div class="loading" id="loading">טוען את מנוע התלת־ממד…</div>
      <div class="views">
        <button class="btn sm accent" id="b2D" title="עריכה שטוחה, במסך מלא"><svg class="i"><use href="#i-flat"/></svg>עריכה 2D</button>
        <button class="btn sm" data-view="front">חזית</button>
        <button class="btn sm" data-view="angle">זווית</button>
        <button class="btn sm" data-view="side">צד</button>
        <button class="btn sm" data-view="back" title="הגב, עם ההדפסה ההפוכה במראה">גב</button>
        <button class="btn sm" id="bSpin" aria-pressed="false">סיבוב</button>
        <button class="btn sm gold" id="bShow">✨ תצוגה מדהימה</button>
        <button class="btn sm" id="bHD">Full HD</button>
      </div>
      <div class="dims" id="dims"></div>
      <div class="ticket" id="ticket" aria-live="polite"></div>
      <div class="showui" id="showUI">
        <div class="fade" id="showFade"></div>
        <div class="cap"><small id="capStep"></small><b id="capText"></b></div>
        <span class="rec" id="showRec" hidden>● מקליט</span>
        <div class="sctl"><button class="btn" id="sReplay">הפעלה מחדש</button><button class="btn" id="sRec720">הקלטת סרטון HD</button><button class="btn" id="sRec1080">הקלטה Full HD</button><button class="btn gold" id="sSave" hidden>שמירת הסרטון</button><button class="btn" id="sClose">סגירה</button></div>
        <div class="sbar"><i id="showProg"></i></div>
      </div>
    </section>
  </div>
</div>
<div class="ed2" id="ed2" hidden role="dialog" aria-label="עורך דו־ממדי">
  <div class="e2top">
    <button class="btn primary" data-e2="close">סיום, חזרה לתלת־ממד</button>
    <div class="e2ttl"><b>עריכה 2D</b><span id="e2Dims"></span></div>
    <div class="e2grp">
      <button class="btn icon ghost" data-e2="undo" title="ביטול" aria-label="ביטול"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="btn icon ghost" data-e2="redo" title="חזרה" aria-label="חזרה"><svg class="i"><use href="#i-redo"/></svg></button>
      <span class="e2sep"></span>
      <button class="btn ghost" data-e2="drawer" id="e2DrawerBtn" aria-pressed="true" title="פתיחה וסגירה של מאגר הרכיבים"><svg class="i"><use href="#i-grid"/></svg><span>רכיבים</span></button>
      <span class="e2sep"></span>
      <button class="btn icon ghost" data-e2="zout" title="הקטנה" aria-label="הקטנה"><svg class="i"><use href="#i-zout"/></svg></button>
      <button class="btn ghost e2zv" data-e2="fit" title="התאמה למסך" id="e2ZoomV">100%</button>
      <button class="btn icon ghost" data-e2="zin" title="הגדלה" aria-label="הגדלה"><svg class="i"><use href="#i-zin"/></svg></button>
      <span class="e2sep"></span>
      <button class="btn ghost" data-e2="mir" id="e2Mir" aria-pressed="false" title="מה המדפסת מקבלת: גב הפרספקס, הפוך מראה"><svg class="i"><use href="#i-mirror"/></svg><span>קובץ הדפסה</span></button>
      <button class="btn icon ghost" data-e2="png" title="הורדת קובץ ההדפסה PNG" aria-label="הורדת קובץ ההדפסה"><svg class="i"><use href="#i-dl"/></svg></button>
      <button class="btn icon ghost" data-e2="full" title="מסך מלא" aria-label="מסך מלא"><svg class="i"><use href="#i-full"/></svg></button>
    </div>
  </div>
  <div class="e2main">
    <div class="e2stage" id="e2Stage">
      <canvas id="e2cv"></canvas>
      <div class="e2add" role="toolbar" aria-label="הוספה">
        <button data-e2="addText"><svg class="i"><use href="#i-text"/></svg><span>טקסט</span></button>
        <label for="e2Img"><svg class="i"><use href="#i-img"/></svg><span>תמונה</span></label><input type="file" id="e2Img" accept="image/*" hidden>
        <button data-e2="addIcon"><svg class="i"><use href="#i-star"/></svg><span>אייקון</span></button>
        <button data-e2="addFx"><svg class="i"><use href="#i-person"/></svg><span>הנצחה</span></button>
      </div>
      <div class="e2ctx" id="e2Ctx" hidden role="toolbar" aria-label="פעולות על הפריט">
        <button data-e2="text"><svg class="i"><use href="#i-pen"/></svg><span>עריכת טקסט</span></button>
        <button data-e2="dup" title="שכפול" aria-label="שכפול"><svg class="i"><use href="#i-copy"/></svg></button>
        <button data-e2="up" title="שכבה קדימה" aria-label="שכבה קדימה"><svg class="i"><use href="#i-up"/></svg></button>
        <button data-e2="down" title="שכבה אחורה" aria-label="שכבה אחורה"><svg class="i"><use href="#i-down"/></svg></button>
        <button data-e2="center" title="מרכוז" aria-label="מרכוז"><svg class="i"><use href="#i-center"/></svg></button>
        <button data-e2="del" class="dng" title="מחיקה" aria-label="מחיקה"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
      <textarea id="e2Text" class="e2text" dir="rtl" hidden aria-label="עריכת טקסט"></textarea>
      <div class="e2note" id="e2MirNote" hidden>כך המדפסת מקבלת את הקובץ: גב הפרספקס, הפוך מראה. מלפנים רואים אותו ישר דרך עובי השקוף.</div>
      <div class="e2legend"><i></i>קו חיתוך לייזר · גלגלת או צביטה לזום · לחיצה כפולה על טקסט לעריכה</div>
    </div>
    <aside class="e2props" id="e2Props" aria-label="עריכת הפריט"></aside>
    <div class="e2side" id="e2Side"><button class="e2x e2close" data-e2="drawer" aria-label="סגירת המאגר" title="סגירה">✕</button></div>
  </div>
</div>
<div class="welcome" id="welcome" hidden></div>
<div id="modalRoot"></div>
